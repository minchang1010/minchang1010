name: Publish Aegis Loop Release
on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - ".github/workflows/publish-aegis.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify package
        shell: bash
        run: |
          mkdir -p out
          cat release/parts/*.part > out/AegisLoop-2026.8.13.5.zip
          echo "797572151C1FC2E6520981E3F52C0BEDE424B16F685069DCFF0F03686AC7C29B  out/AegisLoop-2026.8.13.5.zip" | sha256sum -c -
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v2026.8.13.5 --cleanup-tag --yes 2>/dev/null || true
          gh release create v2026.8.13.5 out/AegisLoop-2026.8.13.5.zip release/latest.json \
            --title "Aegis Loop 2026.8.13.5" \
            --notes "GTX 1070 / RTX 2070 automatic runtime release with corrected installer self-test handling and clean first-run documentation." \
            --latest

name: Publish Aegis Loop Release
on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - ".github/workflows/publish-aegis.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify package
        shell: bash
        run: |
          mkdir -p out
          cat release/parts/*.part > out/AegisLoop-2026.8.14.1.zip
          echo "2327776B357E886B79603C6A2A0C6D8A782A4139BBFBB7B159B0F51BDF82CC62  out/AegisLoop-2026.8.14.1.zip" | sha256sum -c -
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v2026.8.14.1 --cleanup-tag --yes 2>/dev/null || true
          gh release create v2026.8.14.1 out/AegisLoop-2026.8.14.1.zip release/latest.json \
            --title "Aegis Loop 2026.8.14.1" \
            --notes "GTX 1070 / RTX 2070 / RTX 3080 Ti runtime support, fixed first launch, corrected fullscreen scaling, clean resize rendering, and windowed scrolling." \
            --latest
